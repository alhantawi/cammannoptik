<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Subtle linear gradient for the metallic grey lens arch -->
    <linearGradient id="cammannLensGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73767B" stop-opacity="0.4"/>
      <stop offset="25%" stop-color="#93969B" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#A6A9AE" stop-opacity="1"/>
      <stop offset="75%" stop-color="#93969B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#73767B" stop-opacity="0.4"/>
    </linearGradient>
    
    <!-- Premium rich brand red gradient -->
    <linearGradient id="cammannRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5221F"/>
      <stop offset="100%" stop-color="#A51512"/>
    </linearGradient>
  </defs>

  <!-- Top Lens Arc (Crescent Tapered) -->
  <path
    d="M 312 24 C 365 7, 455 7, 510 24 C 455 12, 365 12, 312 24 Z"
    fill="url(#cammannLensGrad)"
  />

  <!-- Bottom Lens Arc (Crescent Tapered) -->
  <path
    d="M 312 76 C 365 93, 455 93, 510 76 C 455 88, 365 88, 312 76 Z"
    fill="url(#cammannLensGrad)"
  />

  <!-- CAMMANN Letters (Clean high-end geometric kerning) -->
  <text
    x="18"
    y="61"
    font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', 'Century Gothic', -apple-system, sans-serif"
    font-size="44"
    font-weight="400"
    letter-spacing="5"
    fill="url(#cammannRedGrad)"
  >CAMMANN</text>

  <!-- OPTIK Letters (Centered inside the lens arcs) -->
  <text
    x="332"
    y="61"
    font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', 'Century Gothic', -apple-system, sans-serif"
    font-size="44"
    font-weight="400"
    letter-spacing="5"
    fill="url(#cammannRedGrad)"
  >OPTIK</text>
</svg>
